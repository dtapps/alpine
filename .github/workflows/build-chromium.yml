# ===================================================================
# GitHub Actions：构建并推送 Chromium 镜像到 GHCR
#
#   产物：ghcr.io/<owner>/<repo>/chromium  （本仓库即 ghcr.io/dtapps/alpine/chromium）
#         标签与 Alpine 基座一致：<alpine 版本> / <major.minor> / latest
#         与 <版本>-linux-{amd64,arm64}
#   实现：GitHub 侧独立维护一份（有意复制，不与 CNB 共用）
#         · Dockerfile  .github/docker/Dockerfile.chromium（Dockerfile.headless 仅供本地派生）
#         · 构建脚本    .github/scripts/build-chromium.sh
#         · 对照实现    .cnb/docker/Dockerfile.* + .cnb/scripts/build-chromium.sh
#
#   基座：本仓库构建的 Alpine 基础镜像（ghcr.io/<owner>/<repo>），由
#         build-alpine workflow 产出；定时任务排在它之后 1 小时（16:35 UTC → 17:35 UTC）。
#         基座不存在时构建直接失败，不会退回官方 alpine。
#   触发：schedule（每天跟上游）/ workflow_dispatch
#         只有这两条：不在 push / pull_request 上自动构建。
#
# 与 CNB 版的差异（复制之后各自演进）：
#   1. 定时任务 01:35 Asia/Shanghai = 17:35 UTC（GitHub cron 只认 UTC）；
#   2. 构建器与 QEMU 由 workflow 现装；chromium 的闭包很大，先释放磁盘；
#   3. 层缓存用 registry 缓存（type=registry，<镜像>:buildcache），与 CNB 侧同构；
#   4. arm64 走 QEMU 模拟，多架构一次要几十分钟，超时给到 120 分钟；
#   5. 元数据写 .github/annotation.json，供 Step Summary / artifact 使用。
#
# 标签契约与 CNB 完全一致，详见 docs/github.md 与
# docs/chromium/images-and-tags.md。
# ===================================================================
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/docker/setup-qemu-action
# https://github.com/docker/setup-buildx-action
# https://github.com/actions/upload-artifact
name: build-chromium

on:
  schedule:
    # 每天 01:35（Asia/Shanghai）= 17:35 UTC。必须排在 GitHub 自己的 Alpine
    # 任务（16:35 UTC）之后 1 小时：Chromium 的基座就是那次构建产出的
    # ghcr.io/<owner>/<repo>:latest。错峰同时避免 chromium 多架构构建与基座构建
    # 抢上游镜像源带宽。
    - cron: '35 17 * * *'
  workflow_dispatch:
    inputs:
      version:
        # 这里填的是 Alpine 版本，不是 Chromium 版本（Chromium 版本由 Alpine 分支仓库决定）
        description: '选填：留空 = 跟随基座 latest；也可填 Alpine 版本 3.24 / 3.24.3（不是 Chromium 版本）。产物标签用解析出的实际版本'
        required: false
        default: ''
        type: string
      expected_chromium_major:
        description: '选填：Chromium 主版本断言。留空 = 不校验，跟随上游最新；填 156 表示确认上游升级；填 any 跳过断言'
        required: false
        default: ''
        type: string

# 显式声明 permissions 后，未列出的 scope 一律为 none，两项都不能省。
#   contents: read  — actions/checkout 检出源码
#   packages: write — 脚本用 GITHUB_TOKEN 登录后推镜像、推 buildcache、提升标签；
#                     write 隐含 read，还要读 build-alpine 产出的 GHCR 基座。
#                     改成 read 会让 --push 报 denied: permission_denied。
permissions:
  contents: read
  packages: write

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 释放磁盘空间
        # runner 临时盘约 14 GiB：删掉无关的预装 SDK，避免构建期 no space left on device。
        # 并发删除预装 SDK：串行会把四个目录的 unlink 耗时相加，这里只等最慢的一个。
        run: |
          sudo rm -rf /usr/share/dotnet & p1=$!
          sudo rm -rf /usr/local/lib/android & p2=$!
          sudo rm -rf /opt/ghc & p3=$!
          sudo rm -rf /opt/hostedtoolcache/CodeQL & p4=$!
          rc=0
          for pid in "$p1" "$p2" "$p3" "$p4"; do
            wait "$pid" || rc=1
          done
          [ "$rc" -eq 0 ] || exit 1
          df -h /

      - name: 安装 QEMU（跨架构构建 arm64）
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 初始化 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送多架构镜像
        id: build
        # 镜像名、revision、source 等由脚本从 Actions 内置变量派生，不必在这里拼：
        #   IMAGE         ← ghcr.io + GITHUB_REPOSITORY（小写）+ /chromium
        #   REGISTRY_USER ← GITHUB_ACTOR
        #   REVISION      ← GITHUB_SHA
        #   IMAGE_SOURCE  ← https://github.com/<GITHUB_REPOSITORY>
        # 只有 GITHUB_TOKEN 不会自动进环境变量（要显式从 secrets 传），其余交给脚本。
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          expected_chromium_major: ${{ inputs.expected_chromium_major }}
        # 必须 source：脚本内部的 export、trap 与退出码都留在当前 shell
        run: |
          source .github/scripts/build-chromium.sh

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo '### Chromium 镜像（GHCR）'
            echo ''
            if [ -f .github/annotation.json ]; then
              echo '| 键 | 值 |'
              echo '| --- | --- |'
              jq -r 'to_entries[] | "| \(.key) | \(.value) |"' .github/annotation.json
            else
              echo '本次没有产出 .github/annotation.json（构建在元数据步骤之前就失败）。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建元数据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-annotation
          path: .github/annotation.json
          if-no-files-found: warn
          retention-days: 30

