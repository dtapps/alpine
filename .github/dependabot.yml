version: 2

updates:
  # GitHub Actions 依赖（扫描 .github/workflows 下的第三方 action 版本）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'github-actions'

  # Docker 基础镜像依赖（扫描 Dockerfile 里的 FROM 镜像标签）
  # 三平台各留一份 Dockerfile 副本，所以按目录分别扫描，避免只覆盖 GitHub 侧。
  - package-ecosystem: 'docker'
    directory: '/.github/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'

  - package-ecosystem: 'docker'
    directory: '/.cnb/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'

  - package-ecosystem: 'docker'
    directory: '/.gitlab/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'
