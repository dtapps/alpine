# ===================================================================
# build-chromium：构建并推送 Chromium 镜像到 $CI_REGISTRY_IMAGE/chromium
#
#   产物：<registry>/<namespace>/<project>/chromium
#   实现：Dockerfile .gitlab/docker/Dockerfile.chromium
#         构建脚本 .gitlab/scripts/build-chromium.sh
#         对照实现 .github/workflows/build-chromium.yml（GHCR）
#
#   基座：同一条流水线里 build-alpine 产出的 $CI_REGISTRY_IMAGE，脚本按 version
#         找到同名标签、取 digest 钉住；基座不存在时直接失败，不退回官方 alpine。
#   标签与 Alpine 基座同一套契约，详见 docs/chromium/images-and-tags.md。
# ===================================================================
build-chromium:
  extends: .docker-build
  stage: chromium
  # optional: true：手动只跑 chromium（TARGET=chromium）时 build-alpine
  #           根本不在流水线里，needs 不能因此把本 job 判成配置错误。
  # artifacts: false：不继承 build-alpine 的产物。本 job 只认自己写的
  #           .gitlab/annotation-chromium.json，继承了也只是多下载一份无用文件。
  needs:
    - job: build-alpine
      artifacts: false
      optional: true
  # 与 build-alpine 同一组：串行执行，不并发改 latest / <minor>。
  resource_group: alpine-image-build
  # arm64 走 QEMU 模拟，chromium 的闭包很大，多架构一次要几十分钟。
  timeout: 2h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TARGET != "alpine"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $TARGET != "alpine"'
    - when: never
  script:
    - |
      set -eu
      export REGISTRY_TOKEN="$CI_REGISTRY_PASSWORD"
      # 表单变量 → 脚本变量：与 GitHub 侧 inputs 语义一致。
      export version="${VERSION:-}"
      export expected_chromium_major="${EXPECTED_CHROMIUM_MAJOR:-}"
      . .gitlab/scripts/build-chromium.sh
      echo '--- 构建元数据 ---'
      cat .gitlab/annotation-chromium.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .gitlab/annotation-chromium.json
