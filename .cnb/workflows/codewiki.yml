'**':
  # Tag 推送（git push --tags）时生成 Code Wiki 并入库知识库。
  # tag_push 是独立的触发键，与 push 同层级（都嵌套在 '**': 下），
  # 直接列出流水线数组（不要嵌套 push:），只在打 tag 时触发，与 push 各流水线相互独立。
  # https://docs.cnb.cool/zh/build/pipeline/trigger.html
  # https://docs.cnb.cool/zh/plugin/public/cnbcool/codewiki.html
  # https://cnb.cool/cnb/plugins/cnbcool/codewiki
  tag_push:
    - stages:
        - name: 生成 Code Wiki
          timeout: 3h
          image: cnbcool/codewiki:latest
          settings:
            # 必填。指定 codewiki 生成文档的保存位置。支持绝对路径，也支持相对路径（会与当前工作目录 PWD 相加得到绝对路径）
            git_doc_dir: /${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/codewiki

  # 自定义按钮触发（对应 .cnb/web_trigger.yml 里的「生成 Code Wiki」）。
  # 本仓库不发版、日常不打 tag，tag_push 基本不会发生，故额外提供手动入口，
  # 让文档能在任意时刻按需重建。两段流水线等价，调整生成参数时请同步修改。
  web_trigger_codewiki:
    - stages:
        - name: 生成 Code Wiki
          timeout: 3h
          image: cnbcool/codewiki:latest
          settings:
            git_doc_dir: /${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/codewiki
