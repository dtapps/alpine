'**':
  # 自定义按钮可触发的事件：web_trigger_build_alpine
  # 单条流水线内用 docker buildx 一次构建 amd64 + arm64，直接产出多架构 manifest list；
  # 两个单平台标签从这份 manifest 派生。基座默认 alpine:latest（每天跟上游），
  # 脚本解析出实际版本后直接用它当标签（同名标签每天覆盖），latest / minor 在冒烟
  # 通过后按 digest 提升；要钉住某次产物请用元数据里记录的 digest。
  # https://cnb.cool/loviselu/docker-buildx-multi-platform-example
  # https://cnb.cool/examples/ecosystem/docker-buildx-multi-platform-example
  web_trigger_build_alpine:
    - name: build-alpine
      runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
        # cpus: 64 # 如有需要，可根据实际情况调整
      # CNB 的 docker 服务默认已支持多架构 buildx，无需 options.rootlessBuildkitd
      services:
        - docker # 启用 Docker 服务（用于 docker buildx/push）
      # 远程 import 是可变引用：main 一改 CI 行为就变，PR 里看不到，也无法审计。
      # TODO 收敛：把 docker.yml vendor 进 .cnb/envs/ 纳入评审，或至少钉到具体
      # commit（https://cnb.cool/dtapp/envs/-/blob/<40 位 sha>/docker.yml）。
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 引入环境变量/配置
        # 不要把 .cnb/scripts/build-alpine.sh 放进 imports：imports 会对被引入的文件
        # 做变量处理，脚本里的 ${...} 会被改写成带引号的字面量（CI 上表现为
        # `sed: can't read "${DOCKERFILE:-.cnb/docker/Dockerfile.alpine}"`）。脚本在仓库里，
        # 由下面的 `source` 直接执行即可。
      stages:
        - name: 构建并推送多架构镜像
          script: |
            source .cnb/scripts/build-alpine.sh
        # 把本次产物的 digest / 体积 / 构建时间写成 commit 元数据。
        # README 徽章从 /-/badge/annotation/commit/latest/{key} 读取这几个值。
        - name: 写入镜像元数据
          # cnbcool/annotations 目前只发 :latest，没有可固定的版本 tag，构建网络内也
          # 取不到 digest（hub.docker.com 不可达）。TODO 待其发布版本化 tag 后改成
          # @sha256:<digest>，避免插件升级悄悄改变元数据写入行为。
          image: cnbcool/annotations:latest
          settings:
            type: ADD
            fromJsonFile: .cnb/annotation.json

  # PR 校验：不推送，只证明「这份 Dockerfile 能构建、容器能起来」。
  # 只对真正改到 alpine 构建输入的 PR 生效，纯文档 PR 直接跳过：
  # 否则改一行 README 也要等一次多分钟的多架构构建。
  pull_request:
    - name: validate-alpine
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      stages:
        - name: 构建（不推送）与冒烟
          script: |
            set -eu
            # 判断本次 PR 是否触及 alpine 的构建输入；判断不出来时按「要校验」处理
            changed=""
            if [ -n "${CNB_TARGET_BRANCH:-}" ] \
              && git rev-parse --verify "origin/${CNB_TARGET_BRANCH}" >/dev/null 2>&1; then
              changed="$(git diff --name-only "origin/${CNB_TARGET_BRANCH}...HEAD" 2>/dev/null || true)"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              changed="$(git diff --name-only HEAD~1 2>/dev/null || true)"
            fi
            case "${changed}" in
              *.cnb/docker/Dockerfile.alpine* | *.cnb/scripts/build-alpine.sh* | *.cnb/workflows/build-alpine.yml*)
                echo "变更涉及 alpine 构建输入，开始校验"
                ;;
              "")
                echo "无法确定变更范围，默认执行校验"
                ;;
              *)
                echo "变更不涉及 alpine 构建输入，跳过校验："
                printf '%s\n' "${changed}"
                exit 0
                ;;
            esac
            # 不传 ALPINE_VERSION，验证的就是 Dockerfile 里的默认值，
            # 免得 PR 改了默认值却仍按旧值校验。
            docker buildx build --platform linux/amd64 --load --pull \
              -f .cnb/docker/Dockerfile.alpine -t alpine:pr . || exit 1
            # 1) 基座版本有输出、时区正确、源行数对、四个命令可执行
            docker run --rm alpine:pr sh -eu -c '
              [ -n "$(cat /etc/alpine-release)" ]
              [ "$(cat /etc/timezone)" = "Asia/Shanghai" ]
              [ "$(date +%z)" = "+0800" ]
              [ "$(wc -l </etc/apk/repositories)" -eq 4 ]
              for b in curl drill nc nslookup; do
                command -v "$b" >/dev/null 2>&1
              done
              printf "SMOKE_OK"
            ' | grep -q 'SMOKE_OK' || exit 1
