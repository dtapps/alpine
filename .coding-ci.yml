# 有新tag时
v*:
  tag_push:
    - services:
        # 流水线中启用 docker 服务 https://ci.coding.net/docs/tutorials/cluster-management/helm_minimally.html
        - docker
      stages:
        - name: 查看 项目 文件信息
          script: du -sh *
        - name: 打包 Docker 镜像
          script: docker build -t dtapps/alpine:$CODING_BRANCH .
        - name: 推送 Docker 镜像
          script: docker push dtapps/alpine:$CODING_BRANCH